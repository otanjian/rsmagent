name: Web readiness
on:
  pull_request:
    branches: [main, rdai, 'codex/ci-validation-*']
  push:
    branches: [main, rdai]
  workflow_dispatch:
jobs:
  web-required:
    name: Web required behavior
    runs-on: rsmagent-web-sync
    timeout-minutes: 45
    steps:
      # Stock actions/checkout drops the /Gitea installation path. Use the
      # event's exact clone URL; keep the job credential out of Git config.
      - name: Check out the exact candidate with full history
        env:
          CI_REPOSITORY_URL: ${{ github.event.repository.clone_url }}
          CI_COMMIT: ${{ github.sha }}
          CI_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$CI_REPOSITORY_URL"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${CI_REPOSITORY_URL}.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CI_JOB_TOKEN" | base64 | tr -d '\n')"
          git fetch --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' "$CI_COMMIT"
          git checkout --detach "$CI_COMMIT"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CI_JOB_TOKEN
      - name: Install Web validation dependencies
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt -r requirements-optional.txt -r requirements-scenes.txt pytest pytest-subtests
          npm --prefix tests/browser ci --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install chromium
      - name: Run required Web behavior
        env:
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          UPSTREAM_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .venv/bin/python scripts/check-upstream-sync.py --output artifacts/upstream-sync
      - name: Preserve required behavior evidence
        if: always()
        # V3 uses the complete runtime URL; the V4 client discards /Gitea.
        uses: https://github.com/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: web-required-behavior
          path: artifacts/upstream-sync
          if-no-files-found: error
