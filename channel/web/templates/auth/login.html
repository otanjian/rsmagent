    <!-- Login Overlay (styled after the oneagent login hero/panel design; keeps the current project logo & brand) -->
    <div id="login-overlay" class="login-hero fixed inset-0 z-[200]">
        <img id="login-bg" src="/assets/login-bg.jpg" class="absolute inset-0 w-full h-full object-cover" alt="">
        <div class="absolute inset-0 bg-gradient-to-b from-slate-950/60 via-slate-900/40 to-slate-950/80"></div>

        <!-- Left hero text -->
        <div class="login-hero-text absolute inset-0 z-10 flex items-center pointer-events-none">
            <div class="pl-6 md:pl-12 lg:pl-24 pb-24">
                <h2 class="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-bold text-white tracking-widest drop-shadow-2xl mb-4 md:mb-6 login-hero-title">容大<span class="brand-ai">企业级AI底座</span></h2>
                <p class="text-lg md:text-xl lg:text-2xl xl:text-3xl text-white/90 tracking-[0.15em] md:tracking-[0.2em] lg:tracking-[0.25em] drop-shadow-lg login-hero-sub">让企业真正拥有自己的AI平台</p>
            </div>
        </div>

        <div class="relative z-10 flex items-center justify-end min-h-[100dvh] px-6 md:px-16 lg:px-28 py-10">
            <div class="login-panel">
                <div class="login-scan-line"></div>
                <div class="flex flex-col items-center mb-8">
                    <img src="/assets/rongda-ai-mark.svg" alt="" class="brand-mark login-brand-mark login-logo" width="64" height="64">
                    <h1 class="login-title" id="login-brand-name">容大<span class="brand-ai">AI</span></h1>
                    <p class="login-tip" id="login-subtitle" data-i18n="account_loading">账号信息加载中</p>
                </div>
                <div id="auth-check-panel" class="auth-check-panel">
                    <p id="auth-check-message" role="status" data-i18n="account_loading">账号信息加载中</p>
                    <button id="auth-check-retry" type="button" class="auth-check-retry hidden"
                            onclick="refreshAccountIdentity()" data-i18n="account_retry">重新检查</button>
                </div>
                <form id="login-form" class="login-form hidden" onsubmit="return false;">
                    <div class="relative" id="login-username-wrap">
                        <input id="login-username" type="text" autocomplete="username"
                               placeholder="Username"
                               class="login-input">
                    </div>
                    <div class="relative">
                        <input id="login-password" type="password" autocomplete="current-password"
                               placeholder="Password"
                               class="login-input">
                        <button type="button" id="login-toggle-pwd"
                                class="login-toggle-pwd"
                                onclick="toggleLoginPassword()">
                            <i class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                    <div id="login-tenant-group" class="hidden">
                        <label class="login-field-label" data-i18n="login_select_tenant">选择租户</label>
                        <select id="login-tenant-select" class="login-input login-select">
                        </select>
                    </div>
                    <p id="login-error" class="login-error hidden"></p>
                    <button id="login-btn" type="submit" class="login-btn">
                        登录
                    </button>
                </form>
                <!-- Desktop re-login entry (change fix-desktop-relogin-session-sync, task 2.4).
                     Shown *instead of* the password form inside a desktop container. A
                     password login here would create a Web-only session the native host
                     knows nothing about -- the page would look signed in while the next
                     local directory bind answers "not signed in". Ending both halves and
                     returning to the shell's own login is the only honest recovery. -->
                <div id="login-recovery" class="login-form hidden">
                    <p id="login-recovery-note" class="login-recovery-note"
                       data-i18n="account_desktop_relogin_note"></p>
                    <p id="login-recovery-error" class="login-error hidden"></p>
                    <button id="login-recovery-btn" type="button" class="login-btn"
                            onclick="desktopRelogin()"
                            data-i18n="account_desktop_relogin_action">返回登录</button>
                </div>
            </div>
        </div>
    </div>
