services:
  rsmagent:
    # The checker's --deployment-env writes the 64 hex digits of a local image
    # ID. Deployment never resolves a tag, pulls a replacement or rebuilds it.
    image: sha256:${RSMAGENT_IMAGE_ID:?Use the image pin generated by check-production.sh --deployment-env}
    pull_policy: never
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${RSMAGENT_PORT:-9899}:9899"
    env_file:
      - ${RSMAGENT_ENV_FILE:?Set an absolute path to the protected runtime environment file}
    environment:
      COW_DATA_DIR: /home/agent/.cow
      WEB_HOST: 0.0.0.0
      COW_LOG_MAX_BYTES: ${COW_LOG_MAX_BYTES:-20971520}
      COW_LOG_BACKUP_COUNT: ${COW_LOG_BACKUP_COUNT:-5}
    volumes:
      - ${RSMAGENT_WORKSPACE_DIR:?Set workspace directory}:/home/agent/cow
      - ${RSMAGENT_DATA_DIR:?Set instance data directory}:/home/agent/.cow
      # Mount additional configured tenant/Agent/database roots explicitly.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9899/api/ready', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    cpus: ${RSMAGENT_CPUS:-2.0}
    mem_limit: ${RSMAGENT_MEMORY:-4g}
    pids_limit: ${RSMAGENT_PIDS:-512}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
# No privileged or seccomp:unconfined bypass. The final Linux host must pass the
# actual bubblewrap probe before release; a failing probe is not acceptance.
