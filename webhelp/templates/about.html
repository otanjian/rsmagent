$def with (v)
<main id="main">
$:(v.page_hero('meta.title_about', 'about.lead'))
<!-- ===== CTA ===== -->
<section class="section section--soft">
<div class="section-container">
<div class="cta-banner reveal">
<h2>$(v.t('cta.title'))</h2>
<p>$(v.t('cta.subtitle'))</p>
<div class="cta-actions">
<a class="btn btn-primary" href="$(v.url('quickstart'))">$(v.t('cta.primary'))</a>
<a class="btn btn-cloud" href="$(v.url('enterprise'))">$(v.t('cta.enterprise'))</a>
</div>
</div>
</div>
</section>
</main>
