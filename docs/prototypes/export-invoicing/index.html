function currentRows(){if(route==='tasks')return filterRows(state.records);if(route==='dashboard')return filterRows(state.records.filter(r=>!['closed','red_partial','red_full'].includes(r.status)));if(route==='drafts')return filterRows(state.records.filter(r=>['draft','ready'].includes(r.status)));if(route==='review')return filterRows(state.records.filter(r=>['review','approved'].includes(r.status)));if(route==='issuing')return filterRows(state.records.filter(r=>['approved','unknown','issued','sap_error','closed','red_partial','red_full'].includes(r.status)));if(route==='reconcile')return filterRows(state.records.filter(r=>['issued','sap_error','closed','red_partial','red_full'].includes(r.status)));return filterRows(state.records)}
function primaryAction(r){const map={ready:['生成草稿',`createDraft('${r.id}')`],match:['去匹配',`go('matching',{id:'${r.id}'})`],missing:['补充资料',`openSupplement('${r.id}')`],draft:['编辑草稿',`go('drafts',{id:'${r.id}'})`],review:['审核',`openReview('${r.id}')`],approved:['开票',`openIssue('${r.id}')`],unknown:['查证结果',`queryInvoice('${r.id}')`],issued:['回写 SAP',`writeSAP('${r.id}')`],sap_error:['重试回写',`writeSAP('${r.id}')`],closed:['查看详情',`openDetail('${r.id}')`],red_partial:['查看详情',`openDetail('${r.id}')`],red_full:['查看详情',`openDetail('${r.id}')`]};return `<button class="link-btn nowrap" onclick="${map[r.status][1]}">${map[r.status][0]}</button>`}
function recordTable(rows,pageSize=8){const pages=Math.max(1,Math.ceil(rows.length/pageSize));activePage=Math.min(activePage,pages);const subset=rows.slice((activePage-1)*pageSize,activePage*pageSize);return `<div class="table-wrap"><table><thead><tr><th style="width:34px"><input type="checkbox" aria-label="选择本页业务" onchange="selectPage(this.checked)" ${subset.length&&subset.every(r=>selected.has(r.id))?'checked':''}></th><th>业务单据 / 客户</th><th>贸易方式</th><th class="right">FOB 金额 · USD</th><th>处理状态</th><th class="right">操作</th></tr></thead><tbody>${subset.map(r=>`<tr class="${selected.has(r.id)?'selected':''}"><td><input type="checkbox" aria-label="选择 ${esc(r.customer)}" ${selected.has(r.id)?'checked':''} onchange="selectOne('${r.id}',this.checked)"></td><td><button class="link-btn record-id" onclick="openDetail('${r.id}')">${esc(r.customs)}</button><div class="sub">${esc(r.customer)} <span style="color:#ccd4dc">·</span> ${esc(r.country)}</div></td><td><span class="badge outline">${r.term}</span><div class="sub">${r.origin} · ${r.date.slice(5)}</div></td><td class="right"><span class="num strong">${fmt(fob(r))}</span><div class="sub num">${money(rmb(r))}</div></td><td>${badge(r.status)}</td><td class="right">${primaryAction(r)}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">${icon('inbox')}<b>没有符合条件的业务</b><p>调整筛选条件，或导入新的业务资料。</p><button class="btn sm" onclick="setFilter('all');query='';render()">清除筛选</button></div></td></tr>`}</tbody></table></div><div class="table-foot"><span>共 ${rows.length} 笔业务 · 每页 ${pageSize} 条</span><div class="pagination"><button onclick="changePage(-1)" aria-label="上一页" ${activePage===1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="${activePage===i+1?'active':''}" onclick="activePage=${i+1};refreshTable()">${i+1}</button>`).join('')}<button onclick="changePage(1)" aria-label="下一页" ${activePage===pages?'disabled':''}>›</button></div></div>`}
function changePage(d){activePage+=d;refreshTable()};function selectOne(id,v){v?selected.add(id):selected.delete(id);refreshTable()};function selectPage(v){currentRows().slice((activePage-1)*(route==='dashboard'?6:8),activePage*(route==='dashboard'?6:8)).forEach(r=>v?selected.add(r.id):selected.delete(r.id));refreshTable()}
function updateBatch(){const b=document.getElementById('batch');if(b)b.innerHTML=selected.size?`<div class="bottom-batch"><span>已选择 <b>${selected.size}</b> 笔业务</span><div class="flex"><button class="btn sm" onclick="selected.clear();refreshTable()">取消选择</button><button class="btn sm" onclick="exportRecords(true)">导出所选</button><button class="btn sm soft" onclick="batchDraft()">批量生成草稿</button></div></div>`:''}
function metric(label,value,suffix,foot,i,warn=false){return `<div class="metric ${warn?'warn':''}"><div class="metric-label">${label}<span class="metric-icon">${icon(i)}</span></div><div class="metric-val num">${value}<span>${suffix}</span></div><div class="metric-foot">${foot}</div><div class="metric-line"></div></div>`}
function dashboard(){const open=state.records.filter(r=>!['closed','red_partial','red_full'].includes(r.status)),total=state.records.reduce((a,r)=>a+rmb(r),0),done=state.records.filter(r=>['closed','red_partial','red_full'].includes(r.status));return head(`<div class="period">${icon('calendar')}2026 年 9 月</div>${button('导入业务资料','openImport()',true,'upload')}`)+`<div class="metrics">${metric('待处理业务',open.length,'笔',`<span>覆盖 ${new Set(open.map(r=>r.customer)).size} 个客户</span><em>查看下方清单</em>`,'file')}${metric('本月 FOB 折合人民币',fmt(total/10000,2),'万元','<span>本月全部 '+state.records.length+' 笔出口业务</span>','money')}${metric('待财务审核',navCount('review'),'笔','<span>资料与计算已就绪</span><em>等待确认</em>','check')}${metric('需要关注',navCount('exceptions'),'项','<span>资料、匹配与接口异常</span><span style="color:var(--amber)">优先处理</span>','alert',true)}</div><div class="pipeline"><span class="pipeline-label">业务处理进度</span>${[['file','资料核对','tasks',['ready','missing']],['match','单据匹配','matching',['match']],['check','财务审核','review',['draft','review']],['receipt','开具发票','issuing',['approved','unknown']],['sync','SAP 回写','reconcile',['issued','sap_error']]].map((x,i)=>`${i?'<div class="pipe-divider"></div>':''}<button class="pipe-step" onclick="go('${x[2]}')"><span class="step-icon">${icon(x[0])}</span><span><b>${x[1]}</b><small>${state.records.filter(r=>x[3].includes(r.status)).length} 笔待处理</small></span></button>`).join('')}</div><div class="dashboard-grid"><section class="card"><div class="card-head"><h2>我的业务待办 <span class="muted small" style="font-weight:400;margin-left:8px">${open.length} 笔</span></h2><button class="link-btn small" onclick="go('tasks')">全部业务</button></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="setFilter('all')">全部待办<span>${open.length}</span></button><button class="tab ${filter==='ready'?'active':''}" onclick="setFilter('ready')">可生成草稿<span>${open.filter(r=>r.status==='ready').length}</span></button><button class="tab ${filter==='review'?'active':''}" onclick="setFilter('review')">待审核<span>${navCount('review')}</span></button></div>${toolbar()}<div id="records-table">${recordTable(currentRows(),6)}</div></section><aside class="dashboard-aside stack"><section class="card"><div class="card-head"><h2>重点关注</h2><span class="badge amber">${navCount('exceptions')} 项</span></div><div class="card-body">${state.records.filter(r=>['unknown','missing','sap_error'].includes(r.status)).slice(0,3).map(r=>`<div class="attention-item" tabindex="0" role="button" onclick="openDetail('${r.id}')" onkeydown="if(event.key==='Enter')openDetail('${r.id}')"><div class="urgent-label">${icon(r.status==='sap_error'?'alert':'clock')} ${STATUSES[r.status][0]}</div><b>${esc(r.customer)}</b><p>${r.status==='unknown'?'提交请求已超时，须先查证出票结果。':r.status==='missing'?'装船日期待核实，请补充有效提单。':'诺诺已出票，SAP 接口回写待恢复。'}</p></div>`).join('')||'<div class="mini-info">当前没有需要优先处理的异常。</div>'}</div></section><section class="card"><div class="card-head"><h2>本月处理进度</h2><span class="muted small">按业务笔数</span></div><div class="card-body"><div class="between"><span class="num" style="font-size:32px;font-weight:600">${Math.round(done.length/state.records.length*100)}<span style="font-size:17px">%</span></span><span class="muted small">已完成 ${done.length} / ${state.records.length}</span></div><div class="progress-bar" style="margin-top:12px"><span style="width:${done.length/state.records.length*100}%"></span></div><div class="progress-row"><span>单据关联完成</span><b>${state.records.filter(r=>r.matched).length} / ${state.records.length}</b></div><div class="progress-row"><span>已取得税票回执</span><b>${state.records.filter(r=>r.invoice).length} / ${state.records.length}</b></div></div></section><div class="assistant-card"><h3>${icon('spark')} 智能助手</h3><p>基于当前业务资料，辅助查找关联单据、解释金额差异。</p><button class="btn sm soft" onclick="openAssistant('今天有哪些业务需要优先处理？')">查看处理建议</button></div></aside></div><div id="batch"></div>`}
function render(){if(!META[route])route='dashboard';renderNav();document.getElementById('crumb').textContent=META[route][0];document.getElementById('app').innerHTML=renderPage()+footer();labelFields();updateBatch();}
function closeModal(){document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';currentId='';}
function modal(title,body,foot='',wide=false){document.getElementById('overlay-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()" aria-label="关闭">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`;document.body.style.overflow='hidden';labelFields();setTimeout(()=>document.querySelector('.modal input,.modal select,.modal button')?.focus(),30)}
function exportRecords(onlySelected=false){const rows=onlySelected?state.records.filter(r=>selected.has(r.id)):currentRows();downloadCSV('出口业务清单_20260929.csv',[['关单号','客户','商品','贸易条款','原币成交金额','FOB金额','FOB人民币','状态'],...rows.map(r=>[r.customs,r.customer,r.product,r.term,r.amount,fob(r),rmb(r),STATUSES[r.status][0]])]);toast(`已导出 ${rows.length} 笔业务`)}
function downloadCSV(name,rows){const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(typeof v==='string'&&/^[=+@\-]/.test(v)?"'"+v:(v??'')).replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile(name,csv,'text/csv;charset=utf-8')}
function downloadFile(name,content,type='text/plain'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function tasksPage(){return head(button('导入业务资料','openImport()',true,'upload'))+`<div class="status-strip">${[['all','全部业务',state.records.length],['ready','可生成草稿',state.records.filter(r=>r.status==='ready').length],['match','待匹配',navCount('matching')],['missing','待补资料',state.records.filter(r=>r.status==='missing').length]].map(x=>`<button class="${filter===x[0]?'active':''}" onclick="setFilter('${x[0]}')">${x[1]}<strong>${x[2]}</strong></button>`).join('')}</div><section class="card">${toolbar()}<div id="records-table">${recordTable(currentRows())}</div></section><div id="batch"></div>`}
function createDraft(id){const r=getRecord(id);if(!r||r.status!=='ready'){toast('当前业务状态不允许生成草稿','error');return}const mapping=state.mappings.find(m=>m.material===r.material);if(!r.matched||!r.documents){toast('请先完成资料与单据匹配','error');return}if(!mapping||mapping.status!=='已审核'){toast('该商品映射待复核，请先确认映射','error');go('products');return}r.taxCode=mapping.tax;r.status='draft';log(r,'生成开票草稿 · 林悦');draftId=id;go('drafts',{id});toast('开票草稿已生成')}
function batchDraft(){let n=0;for(const r of state.records){if(selected.has(r.id)&&r.status==='ready'&&r.matched&&r.documents&&state.mappings.some(m=>m.material===r.material&&m.status==='已审核')){r.status='draft';log(r,'批量生成开票草稿 · 林悦');n++}}selected.clear();render();toast(n?`已生成 ${n} 份草稿，其余业务不满足生成条件`:'所选业务尚不满足生成草稿条件',n?'success':'error')}
function matchingPage(){const pending=state.records.filter(r=>r.status==='match');let r=getRecord(matchId);if(!r||r.status!=='match')r=pending[0];if(!r)return head()+`<section class="card"><div class="empty">${icon('checkCircle')}<b>待匹配业务已处理完成</b><p>已确认的关联保存在业务明细中，可继续生成开票草稿。</p>${button('查看待开票业务',"go('tasks')",true)}</div></section>`;matchId=r.id;return head(button('查看原始资料',`openDetail('${r.id}','sources')`,false,'file'))+`<div class="notice" style="margin-bottom:20px">${icon('info')}<span>先确认关联单据，再核对分配数量。存在多个交货行时，分配合计须与关单数量一致。</span></div><div class="two-col"><section class="card"><div class="card-head"><h2>报关明细</h2><select aria-label="选择待匹配业务" onchange="matchId=this.value;render()">${pending.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${x.customer}</option>`).join('')}</select></div><div class="card-body"><div class="doc-paper"><div class="doc-title">出口货物报关单 <span class="badge outline">演示单据</span></div><div class="form-grid"><div><span class="muted">海关编号</span><br><b class="mono">${esc(r.customs)}</b></div><div><span class="muted">境外收货人</span><br>${esc(r.customer)}</div><div><span class="muted">贸易方式 / 成交方式</span><br>一般贸易 / ${r.term}</div><div><span class="muted">出口日期</span><br>${esc(r.date)}</div></div><table><thead><tr><th>项号</th><th>商品名称</th><th class="right">数量</th><th>单位</th></tr></thead><tbody><tr><td>01</td><td><span class="highlight">${esc(r.product)}</span></td><td class="right num">${fmt(r.qty,0)}</td><td>${esc(r.unit)}</td></tr></tbody></table><div class="calc-row"><span>成交总额</span><strong class="num">USD ${fmt(r.amount)}</strong></div><div class="calc-row"><span>关单商品编码</span><strong class="mono">${esc(r.hs)} <span class="muted small">示例</span></strong></div></div><div class="divider"></div><div class="section-label">关联核对</div><div class="calc-row"><span>报关数量</span><strong>${fmt(r.qty,0)} 米</strong></div><div class="calc-row"><span>已选择分配数量</span><strong id="allocation-total">${fmt(r.qty,0)} 米</strong></div><div class="notice success" id="allocation-status">${icon('checkCircle')}分配数量一致，可继续确认。</div></div></section><section class="card"><div class="card-head"><h2>${icon('spark')} 交货单匹配建议</h2><span class="badge green">2 条高匹配候选</span></div><div class="card-body"><p class="muted" style="margin:0 0 16px;font-size:13px">基于 OA 排载编号、客户与物料匹配，建议关联以下两条交货明细。</p>${[.64,.36].map((fraction,i)=>`<label class="match-choice chosen"><input type="checkbox" class="allocation-check" data-qty="${r.qty*fraction}" checked onchange="updateAllocation('${r.id}')"><div class="grow"><div class="between"><b>${esc(r.delivery)}${i?'-02':'-01'}</b><span class="badge green">${i?'97':'99'}% 匹配</span></div><small>${esc(r.material)} · ${esc(r.product)}</small><div class="between" style="margin-top:10px"><span class="num">${fmt(r.qty*fraction,0)} 米</span><span class="num">USD ${fmt(r.amount*fraction)}</span></div><small>依据：同一排载 ${esc(r.trade)} · 客户一致 · 单位一致</small></div></label>`).join('')}<div class="match-choice" style="opacity:.55;cursor:default"><input type="checkbox" disabled aria-label="排除不同物料候选"><div><b>008016398-01</b><small>已排除：物料规格不同，且已分配至其他报关单。</small></div></div><div class="divider"></div><div class="section-label">出口业务政策确认</div><label class="flex" style="align-items:flex-start;color:#6d8091;font-size:13px"><input type="checkbox" id="policy-confirm">已按企业签认口径核实本笔业务的出口类型、适用政策及相关凭证。</label><div style="margin-top:20px;display:flex;justify-content:flex-end">${button('确认关联',`confirmMatch('${r.id}')`,true,'link')}</div></div></section></div>`}
function updateAllocation(id){const r=getRecord(id),sum=[...document.querySelectorAll('.allocation-check:checked')].reduce((a,x)=>a+Number(x.dataset.qty),0);document.querySelectorAll('.allocation-check').forEach(x=>x.closest('label').classList.toggle('chosen',x.checked));document.getElementById('allocation-total').textContent=fmt(sum,0)+' 米';const ok=Math.abs(sum-r.qty)<.00001;const el=document.getElementById('allocation-status');el.className='notice '+(ok?'success':'warning');el.innerHTML=icon(ok?'checkCircle':'alert')+(ok?'分配数量一致，可继续确认。':`仍有 ${fmt(r.qty-sum,0)} 米未完成关联。`)}
function confirmMatch(id){const r=getRecord(id);if(!r||r.status!=='match')return;const sum=[...document.querySelectorAll('.allocation-check:checked')].reduce((a,x)=>a+Number(x.dataset.qty),0);if(Math.abs(sum-r.qty)>.00001){toast('分配数量必须与报关数量一致','error');return}if(!document.getElementById('policy-confirm').checked){toast('请先确认本笔业务的出口类型及适用政策','error');return}r.matched=true;r.status='ready';r.allocations=[{delivery:r.delivery+'-01',qty:r.qty*.64},{delivery:r.delivery+'-02',qty:r.qty*.36}];log(r,'确认 2 条交货明细关联，业务政策已人工核实');toast('单据关联已保存；商品编码仍需在映射库复核');render()}
function draftsPage(){const r=getRecord(draftId);if(r&&['draft','ready'].includes(r.status))return draftEditor(r);return head(button('查看待开票业务',"go('tasks')",false,'file'))+`<section class="card"><div class="card-head"><h2>草稿清单</h2><span class="muted small">编辑并核对后提交审核</span></div>${toolbar()}<div id="records-table">${recordTable(currentRows())}</div></section><div id="batch"></div>`}
function draftEditor(r){return head(`${button('返回草稿列表',"draftId='';render()")}${button('保存草稿',`saveDraft('${r.id}',false)`)}${button('提交审核',`saveDraft('${r.id}',true)`,true,'check')}`)+`<div class="detail-grid"><div class="stack"><section class="card"><div class="card-head"><h2>开票草稿 <span class="muted small">DRAFT-${r.id}</span></h2>${badge(r.status)}</div><div class="card-body"><div class="invoice-heading"><div class="integration-icon">票</div><div><b>出口业务普通发票 · 演示票种</b><div class="small muted">开票主体：衡川纺织（中国）有限公司</div></div></div><form id="draft-form"><div class="form-grid cols3"><div class="form-field"><label>境外购方</label><input value="${esc(r.customer)}" readonly></div><div class="form-field"><label>报关单号</label><input value="${esc(r.customs)}" readonly></div><div class="form-field"><label>贸易条款</label><input value="${r.term}" readonly></div><div class="form-field"><label>原币成交金额 · USD</label><input value="${r.amount}" readonly></div><div class="form-field"><label>国际运费 · USD</label><input id="draft-freight" type="number" min="0" max="${r.amount}" step="0.01" value="${r.freight}" ${r.term==='FOB'?'readonly':''} required oninput="recalcDraft('${r.id}')"></div><div class="form-field"><label>保险费 · USD</label><input id="draft-insurance" type="number" min="0" max="${r.amount}" step="0.01" value="${r.insurance}" ${r.term!=='CIF'?'readonly':''} required oninput="recalcDraft('${r.id}')"></div><div class="form-field"><label>人民币折算汇率</label><input id="draft-rate" type="number" min="0.000001" step="0.000001" max="1000" value="${r.rate}" required oninput="recalcDraft('${r.id}')"></div><div class="form-field"><label>收入确认日期 · 已人工核实</label><input type="date" value="${esc(r.date)}" readonly></div><div class="form-field"><label>票面金额口径</label><input value="FOB 折合人民币（演示）" readonly></div></div><div class="divider"></div><div class="section-label">商品明细</div><div class="table-wrap"><table><thead><tr><th>商品 / 物料</th><th>税收分类编码</th><th class="right">数量</th><th>单位</th><th class="right">FOB 原币单价</th></tr></thead><tbody><tr><td>${esc(r.product)}<div class="sub">${esc(r.material)}</div></td><td><span class="mono">${esc(r.taxCode)}</span><div class="sub">演示分类编码</div></td><td class="right num">${fmt(r.qty,0)}</td><td>${esc(r.unit)}</td><td class="right num" id="draft-price">${fmt(fob(r)/r.qty,6)}</td></tr></tbody></table></div><div class="form-field" style="margin-top:20px"><label for="draft-note">发票备注</label><textarea id="draft-note" maxlength="400">${esc(r.note.replace(/；报关单.*$/, ''))}；报关单 ${esc(r.customs)}；FOB ${fmt(fob(r))} USD</textarea></div></form><div class="notice" style="margin-top:20px">${icon('info')}票种、税收分类及票面金额为交互示例。正式上线前按企业实际开票口径配置。</div></div></section><section class="card"><div class="card-head"><h2>来源依据</h2><button class="link-btn" onclick="openDetail('${r.id}','sources')">查看单据</button></div><div class="card-body"><div class="form-grid cols3"><div class="field-value"><span class="muted small">交易单</span><br>${esc(r.trade)}</div><div class="field-value"><span class="muted small">SAP 交货单</span><br>${esc(r.delivery)}</div><div class="field-value"><span class="muted small">提单</span><br>${esc(r.bl)}</div></div></div></section></div><aside class="stack"><section class="card"><div class="card-head"><h2>金额计算</h2><span class="badge green">实时校验</span></div><div class="card-body"><div class="calc-row"><span>${r.term} 成交金额</span><strong>USD ${fmt(r.amount)}</strong></div><div class="calc-row"><span>减：国际运费</span><strong id="calc-freight">${fmt(r.freight)}</strong></div><div class="calc-row"><span>减：保险费</span><strong id="calc-insurance">${fmt(r.insurance)}</strong></div><div class="calc-row"><span>FOB 原币金额</span><strong id="calc-fob">USD ${fmt(fob(r))}</strong></div><div class="calc-row"><span>折算汇率</span><strong id="calc-rate">${r.rate.toFixed(6)}</strong></div><div class="calc-row total"><span>票面金额 · CNY</span><strong id="calc-rmb">${money(rmb(r))}</strong></div><div class="small muted" style="margin-top:8px">按业务口径计算，人民币保留 2 位小数。</div><div id="calc-error"></div></div></section><section class="card"><div class="card-head"><h2>提交前检查</h2></div><div class="card-body">${checklist(r)}<div class="divider"></div><button class="btn soft" style="width:100%" onclick="openAssistant('请解释当前草稿的 FOB 计算','${r.id}')">${icon('spark')}解释计算依据</button></div></section></aside></div>`}
function checklist(r){return [[r.matched,'交货与报关明细已关联','数量分配与关单一致'],[r.documents,'运输及费用资料齐全','来源单据可追溯'],[state.mappings.some(m=>m.material===r.material&&m.status==='已审核'),'商品映射已复核','采用已审核映射版本'],[true,'金额与汇率口径已明确','最终由财务审核确认']].map(([ok,a,b])=>`<div class="check-row ${ok?'':'warn'}">${icon(ok?'checkCircle':'alert')}<div>${a}${ok?'':' · 待完成'}<small>${b}</small></div></div>`).join('')}
function draftValues(id){const r=getRecord(id);return {...r,freight:Number(document.getElementById('draft-freight').value),insurance:Number(document.getElementById('draft-insurance').value),rate:Number(document.getElementById('draft-rate').value)}}
function recalcDraft(id){const r=draftValues(id);const note=document.getElementById('draft-note');note.value=note.value.replace(/；FOB [\d,.]+ USD/g,'；FOB '+fmt(fob(r))+' USD');document.getElementById('calc-freight').textContent=fmt(r.freight);document.getElementById('calc-insurance').textContent=fmt(r.insurance);document.getElementById('calc-fob').textContent='USD '+fmt(fob(r));document.getElementById('calc-rate').textContent=r.rate.toFixed(6);document.getElementById('calc-rmb').textContent=money(rmb(r));document.getElementById('draft-price').textContent=fmt(fob(r)/r.qty,6);document.getElementById('calc-error').innerHTML=fob(r)<0||r.rate<=0?'<div class="notice error" style="margin-top:15px">费用不得超过成交金额，汇率必须大于零。</div>':''}
function saveDraft(id,submit){const form=document.getElementById('draft-form');if(!form.reportValidity())return;const next=draftValues(id),r=getRecord(id);if(fob(next)<0||next.rate<=0){toast('请检查费用金额与汇率','error');return}if(submit&&(!r.matched||!r.documents||!state.mappings.some(m=>m.material===r.material&&m.status==='已审核'))){toast('提交前检查尚未全部通过','error');return}r.freight=next.freight;r.insurance=next.insurance;r.rate=next.rate;r.note=document.getElementById('draft-note').value.replace(/；FOB [\d,.]+ USD/g,'；FOB '+fmt(fob(r))+' USD');r.status=submit?'review':'draft';log(r,submit?'提交开票审核，草稿版本已锁定':'保存开票草稿');toast(submit?'已提交财务审核':'草稿已保存');if(submit){draftId='';go('review')}else render()}
function reviewPage(){return head()+`<div class="review-summary" style="margin-bottom:20px">审批绑定当前草稿数据。金额、商品映射或来源资料变更后，需要重新提交审核。</div><section class="card"><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="setFilter('all')">全部审核</button><button class="tab ${filter==='review'?'active':''}" onclick="setFilter('review')">待我审核<span>${navCount('review')}</span></button><button class="tab ${filter==='approved'?'active':''}" onclick="setFilter('approved')">已通过</button></div>${toolbar()}<div id="records-table">${recordTable(currentRows())}</div></section>`}
function openReview(id){const r=getRecord(id);if(r.status!=='review'){toast('该业务已处理，请刷新后查看','error');render();return}modal('审核开票草稿',`<div class="between" style="margin-bottom:20px"><div><b>${esc(r.customer)}</b><div class="muted small">${esc(r.customs)} · ${esc(r.trade)}</div></div>${badge(r.status)}</div><div class="two-col"><div><div class="section-label">开票信息</div><div class="calc-row"><span>商品名称</span><strong>${esc(r.product)}</strong></div><div class="calc-row"><span>数量 / 单位</span><strong>${fmt(r.qty,0)} ${esc(r.unit)}</strong></div><div class="calc-row"><span>成交条款 / 币种</span><strong>${r.term} / USD</strong></div><div class="calc-row"><span>FOB</span><strong>USD ${fmt(fob(r))}</strong></div><div class="calc-row"><span>汇率</span><strong>${r.rate.toFixed(6)}</strong></div><div class="calc-row total"><span>票面金额</span><strong>${money(rmb(r))}</strong></div></div><div><div class="section-label">资料及规则检查</div>${checklist(r)}<button class="link-btn" onclick="openDetail('${r.id}','sources')">查看原始依据</button></div></div><div class="divider"></div><div class="form-field"><label for="review-note">审核意见（退回时必填）</label><textarea id="review-note" placeholder="例如：费用依据已核实，按当前口径开票。" maxlength="500"></textarea></div><label class="flex" style="margin-top:18px;color:#63788a;font-size:13px;align-items:flex-start"><input id="review-confirm" type="checkbox">我已核对购方、商品、金额、日期及相关依据。</label>`,`${button('退回修改',`decideReview('${id}',false)`)}${button('审核通过',`decideReview('${id}',true)`,true,'check')}`,true);currentId=id}
function decideReview(id,approve){const r=getRecord(id),note=document.getElementById('review-note').value.trim();if(r.status!=='review'){toast('该草稿已不在待审核状态','error');return}if(approve&&!document.getElementById('review-confirm').checked){toast('请先勾选审核确认','error');return}if(!approve&&!note){toast('请填写退回原因','error');document.getElementById('review-note').focus();return}r.status=approve?'approved':'draft';r.approval=approve?{reviewer:'林悦',amount:rmb(r),time:today,note}:null;log(r,(approve?'审核通过':'退回修改')+' · '+(note||'已核实开票信息'));closeModal();render();toast(approve?'审核通过，可进入开票环节':'草稿已退回修改')}
function issuingPage(){return head(button('导出开票记录','exportInvoiceRegister()',false,'download'))+`<div class="metrics">${metric('等待开票',state.records.filter(r=>r.status==='approved').length,'笔','<span>已完成财务审核</span>','receipt')}${metric('出票结果待查',state.records.filter(r=>r.status==='unknown').length,'笔','<span>查证前禁止重复提交</span>','clock',true)}${metric('已取得发票',state.records.filter(r=>r.invoice).length,'张','<span>已保存对应演示回执</span>','check')}${metric('涉及红冲',state.records.filter(r=>r.redAmount>0).length,'笔','<span>保留原票和红票关联</span>','history')}</div><section class="card">${toolbar()}<div id="records-table">${invoiceTable()}</div></section>`}
function invoiceTable(){const rows=currentRows();return `<div class="table-wrap"><table><thead><tr><th>发票 / 开票申请</th><th>客户与关单</th><th class="right">票面金额 · CNY</th><th>状态</th><th class="right">操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="link-btn record-id" onclick="openDetail('${r.id}')">${r.invoice||'REQ-'+r.id}</button><div class="sub">${r.invoice?'出口普通发票 · 演示':'开票申请 · '+r.date}</div></td><td>${esc(r.customer)}<div class="sub mono">${esc(r.customs)}</div></td><td class="right num strong">${fmt(rmb(r))}${r.redAmount?`<div class="sub" style="color:var(--red)">已红冲 ¥ ${fmt(r.redAmount*r.rate)}</div>`:''}</td><td>${badge(r.status)}</td><td class="right"><div style="display:flex;gap:13px;justify-content:flex-end">${['approved','unknown'].includes(r.status)?primaryAction(r):`<button class="link-btn" onclick="viewReceipt('${r.id}')">查看票面</button><button class="link-btn" onclick="openRed('${r.id}')">红冲</button>`}</div></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">暂无符合条件的开票记录</div></td></tr>'}</tbody></table></div><div class="table-foot">共 ${rows.length} 条 · 所有出票操作均为本机模拟</div>`}
function openIssue(id){const r=getRecord(id);if(r.status!=='approved'){toast('请先完成财务审核','error');return}modal('确认开具发票',`<div class="notice success">${icon('checkCircle')}草稿已审核通过，将使用当前锁定版本提交。</div><div style="margin-top:15px"><div class="calc-row"><span>购方</span><strong>${esc(r.customer)}</strong></div><div class="calc-row"><span>申请编号</span><strong class="mono">REQ-${r.id}</strong></div><div class="calc-row"><span>票种</span><strong>出口普通发票 · 演示</strong></div><div class="calc-row total"><span>票面金额</span><strong>${money(rmb(r))}</strong></div></div><div class="divider"></div><div class="form-field"><label for="issue-result">演示回执场景</label><select id="issue-result"><option value="success">成功出票</option><option value="timeout">提交超时，结果待查</option><option value="fail">平台明确拒绝，保留待开票</option></select></div><div class="small muted" style="margin-top:12px">本次操作不会连接诺诺或开具真实发票。</div>`,`${button('取消','closeModal()')}${button('确认开票（模拟）',`issueInvoice('${id}')`,true,'receipt')}`);currentId=id}
function issueInvoice(id){const r=getRecord(id),mode=document.getElementById('issue-result').value;if(r.status!=='approved'){toast('该申请已经提交，请查询开票记录','error');return}if(mode==='fail'){log(r,'模拟平台明确拒绝：购方资料校验未通过');closeModal();toast('模拟开票失败，申请保留为待开票','error');render();return}if(mode==='timeout'){r.status='unknown';log(r,'模拟开票请求超时，保留申请号并等待查证');closeModal();go('issuing');toast('提交超时，已转入结果待查');return}r.invoice='DEMO-2631'+r.id.slice(-6);r.status='issued';log(r,'模拟诺诺出票成功，已保存发票回执');closeModal();go('issuing');toast('模拟出票成功，等待 SAP 回写')}
function queryInvoice(id){const r=getRecord(id);if(r.status!=='unknown')return;modal('查证开票结果',`<div class="notice warning">${icon('info')}该请求之前已提交。查证过程中保持原申请号，避免重复开票。</div><div class="calc-row"><span>开票申请</span><strong class="mono">REQ-${id}</strong></div><div class="calc-row"><span>购方</span><strong>${esc(r.customer)}</strong></div><div class="form-field" style="margin-top:12px"><label>演示查询结果</label><select id="query-result"><option value="issued">查到已开具发票</option><option value="none">确认未开具，可重新提交</option><option value="unknown">仍无法确定，继续保留待查</option></select></div>`,`${button('取消','closeModal()')}${button('执行查证（模拟）',`confirmQuery('${id}')`,true,'search')}`)}
function confirmQuery(id){const r=getRecord(id),v=document.getElementById('query-result').value;if(r.status!=='unknown')return;if(v==='issued'){r.invoice='DEMO-2631'+r.id.slice(-6);r.status='issued';log(r,'按原申请号查证：已出票，补录回执')}else if(v==='none'){r.status='approved';log(r,'平台查证确认未出票，恢复可提交状态')}else log(r,'查询仍无法确定，保持结果待查且禁止重复开票');closeModal();render();toast(v==='issued'?'已补录发票回执，可继续回写 SAP':v==='none'?'已确认未出票，可重新提交':'结果仍待查，未重复提交')}
function viewReceipt(id){const r=getRecord(id);if(!r.invoice)return;modal('税票回执预览',`<div class="doc-paper"><div class="doc-title" style="color:#8a6271;border-color:#bd97a6">电子普通发票 <span class="badge outline">演示票面</span></div><div class="between small"><span>发票号码：${esc(r.invoice)}</span><span>开票日期：2026-09-29</span></div><div class="divider"></div><div class="form-grid"><div>购买方：${esc(r.customer)}<br><span class="muted small">境外客户 · ${esc(r.country)}</span></div><div>销售方：衡川纺织（中国）有限公司<br><span class="muted small">主体信息仅供演示</span></div></div><table><thead><tr><th>项目名称</th><th>单位</th><th class="right">数量</th><th class="right">金额 · CNY</th></tr></thead><tbody><tr><td>${esc(r.product)}</td><td>${esc(r.unit)}</td><td class="right">${fmt(r.qty,0)}</td><td class="right">${fmt(rmb(r))}</td></tr></tbody></table><div class="calc-row total"><span>票面合计</span><strong>${money(rmb(r))}</strong></div><div class="divider"></div><div class="small">备注：${esc(r.note)}<br>报关单：${esc(r.customs)} · FOB USD ${fmt(fob(r))} · 汇率 ${r.rate}</div></div><p class="small muted">此为交互原型生成的演示票面，不具有发票效力。</p>`,`${button('关闭','closeModal()')}${button('下载回执',`downloadReceipt('${id}')`,true,'download')}`,true)}
function downloadReceipt(id){const r=getRecord(id);downloadFile(r.invoice+'_演示回执.txt',`【交互原型演示回执，不具发票效力】\n发票号码：${esc(r.invoice)}\n客户：${esc(r.customer)}\n报关单：${esc(r.customs)}\n商品：${esc(r.product)}\n数量：${r.qty} ${esc(r.unit)}\nFOB：USD ${fob(r)}\n人民币金额：${rmb(r)}\n汇率：${r.rate}\n状态：${STATUSES[r.status][0]}\n`);toast('已下载演示回执')}
function exportInvoiceRegister(){downloadCSV('开票记录_演示.csv',[['开票申请号','税票号','客户','票面金额','红冲原币金额','状态'],...state.records.filter(r=>r.invoice||['approved','unknown'].includes(r.status)).map(r=>['REQ-'+r.id,r.invoice,r.customer,rmb(r),r.redAmount,STATUSES[r.status][0]])]);toast('开票记录已导出')}
function openRed(id){const r=getRecord(id);if(!r.invoice)return;const remaining=Math.round((fob(r)-r.redAmount)*100)/100;if(remaining<=0){toast('原票已全部红冲，无可红冲余额','error');return}modal('发起红冲申请',`<div class="notice warning">${icon('info')}红票关联原票保存。此处演示金额红冲，正式业务还需按实际票种处理数量、申报及 SAP 调整。</div><div class="calc-row"><span>原票号码</span><strong class="mono">${esc(r.invoice)}</strong></div><div class="calc-row"><span>剩余可红冲 FOB</span><strong>USD ${fmt(remaining)}</strong></div><form id="red-form"><div class="form-grid" style="margin-top:15px"><div class="form-field"><label>本次红冲金额 · USD</label><input type="number" id="red-amount" min="0.01" max="${remaining}" step="0.01" required placeholder="请输入金额"></div><div class="form-field"><label>红冲原因</label><select id="red-reason"><option>销售折让</option><option>退货</option><option>开票信息有误</option></select></div><div class="form-field full"><label>原因说明</label><textarea id="red-note" required placeholder="填写调整依据与涉及单据"></textarea></div></div></form>`,`${button('取消','closeModal()')}${button('确认红冲（模拟）',`confirmRed('${id}')`,true,'history')}`)}
function confirmRed(id){if(!document.getElementById('red-form').reportValidity())return;const r=getRecord(id),amount=Number(document.getElementById('red-amount').value),reason=document.getElementById('red-reason').value,note=document.getElementById('red-note').value;if(amount<=0||amount>fob(r)-r.redAmount){toast('红冲金额超过可用余额','error');return}r.redAmount=Math.round((r.redAmount+amount)*100)/100;r.status=r.redAmount>=fob(r)?'red_full':'red_partial';r.redNeedsSync=true;r.redReceipt='RED-DEMO-'+Date.now().toString().slice(-8);log(r,`模拟红冲 USD ${fmt(amount)} · ${reason} · ${note}；待同步 SAP 与申报调整`);closeModal();render();toast('已生成红冲关联记录，SAP 调整待处理')}
function reconcilePage(){const rows=state.records.filter(r=>['issued','sap_error','closed','red_partial','red_full'].includes(r.status));return head(button('导出对账清单',"exportReconciliation()",false,'download'))+`<div class="metrics">${metric('待回写',rows.filter(r=>r.status==='issued').length,'笔','<span>税票回执已取得</span>','sync')}${metric('回写失败',rows.filter(r=>r.status==='sap_error').length,'笔','<span>仅重试 SAP，不重复开票</span>','alert',true)}${metric('红冲待调整',rows.filter(r=>r.redNeedsSync).length,'笔','<span>原票记录持续保留</span>','history',true)}${metric('已完成对账',rows.filter(r=>r.sapDoc&&!r.redNeedsSync).length,'笔','<span>同口径金额已核对</span>','check')}</div><section class="card"><div class="card-head"><h2>税票与 SAP 凭证核对</h2><span class="badge outline">公司代码 HC01 · CNY</span></div><div class="table-wrap"><table><thead><tr><th>客户 / 交货单</th><th>税票 / SAP 凭证</th><th class="right">税票同口径金额</th><th class="right">SAP 同口径金额</th><th class="right">差额</th><th>状态</th><th class="right">操作</th></tr></thead><tbody>${rows.map(r=>{const expected=Math.round((fob(r)-r.redAmount)*r.rate*100)/100,actual=r.sapDoc?(r.redNeedsSync?rmb(r):expected):null;return `<tr><td>${esc(r.customer)}<div class="sub">${esc(r.delivery)}</div></td><td><span class="mono">${esc(r.invoice)}</span><div class="sub">${r.sapDoc||'尚未取得 SAP 回执'}</div></td><td class="right num">${fmt(expected)}</td><td class="right num">${actual===null?'—':fmt(actual)}</td><td class="right num" style="color:${r.redNeedsSync?'var(--red)':'var(--muted)'}">${actual===null?'待回写':fmt(expected-actual)}</td><td>${r.redNeedsSync?'<span class="badge amber">红冲待调整</span>':badge(r.status)}</td><td class="right">${r.redNeedsSync?`<button class="link-btn nowrap" onclick="syncRed('${r.id}')">处理调整</button>`:!r.sapDoc?`<button class="link-btn nowrap" onclick="writeSAP('${r.id}')">${r.status==='sap_error'?'重试回写':'回写 SAP'}</button>`:`<button class="link-btn" onclick="openDetail('${r.id}','history')">查看凭证</button>`}</td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">尚无待对账发票</div></td></tr>'}</tbody></table></div><div class="wide-note">按已确认的 FOB 人民币口径展示对账。应收账款总额、成交金额和退税申报金额分别保存。</div></section><div class="two-col" style="margin-top:20px"><section class="card"><div class="card-head"><h2>尾差处理原则</h2></div><div class="card-body"><div class="check-row">${icon('checkCircle')}先核对币种、汇率日期及逐行舍入顺序。</div><div class="check-row">${icon('checkCircle')}仅对已确认舍入差执行经批准的调整。</div><div class="check-row warn">${icon('alert')}真实汇率差、费用差异进入人工处理。</div></div></section><section class="card"><div class="card-head"><h2>回写记录</h2><span class="muted small">最近操作</span></div><div class="card-body">${state.audit.filter(a=>/SAP|回写/.test(a.text)).slice(0,3).map(a=>`<div class="attention-item"><b>${esc(a.text)}</b><p>${a.id}</p></div>`).join('')||'<div class="mini-info">完成一次回写后，这里会显示操作结果及对应业务。</div>'}</div></section></div>`}
function writeSAP(id){const r=getRecord(id);if(!['issued','sap_error'].includes(r.status)){toast('当前记录不需要重复回写','error');return}modal('确认 SAP 回写',`<div class="notice">${icon('info')}本次仅回写税票关联和演示凭证，不会重新提交开票申请。</div><div class="calc-row"><span>税票号码</span><strong class="mono">${esc(r.invoice)}</strong></div><div class="calc-row"><span>SAP 交货单</span><strong>${esc(r.delivery)}</strong></div><div class="calc-row"><span>核对金额</span><strong>${money(rmb(r))}</strong></div><div class="form-field" style="margin-top:15px"><label>演示回写结果</label><select id="sap-result"><option value="success">回写成功</option><option value="fail">SAP 接口连接失败</option></select></div>`,`${button('取消','closeModal()')}${button('确认回写（模拟）',`confirmSAP('${id}')`,true,'sync')}`)}
function confirmSAP(id){const r=getRecord(id);if(!['issued','sap_error'].includes(r.status))return;const fail=document.getElementById('sap-result').value==='fail';if(fail){r.status='sap_error';log(r,'SAP 模拟接口连接失败，税票已开具，无需重开')}else{r.status='closed';r.sapDoc='9000'+r.id.slice(-4);log(r,'SAP 模拟回写成功 · 凭证 '+r.sapDoc+' · 同口径金额一致')}closeModal();render();toast(fail?'回写失败，可在 SAP 对账中重试':'SAP 回写完成，对账一致',fail?'error':'success')}
function syncRed(id){const r=getRecord(id);modal('红冲后续调整',`<div class="notice warning">${icon('info')}需要同步处理 SAP 凭证及退税申报影响，保留原票与红票关联。</div><div class="calc-row"><span>累计红冲原币金额</span><strong>USD ${fmt(r.redAmount)}</strong></div><div class="calc-row"><span>人民币调整金额</span><strong>${money(r.redAmount*r.rate)}</strong></div><label class="flex" style="margin:15px 0"><input type="checkbox" id="red-tax-confirm">已核实对应申报调整或无需调整的依据。</label>`,`${button('取消','closeModal()')}${button('记录调整完成（模拟）',`finishRed('${id}')`,true)}`)}
function finishRed(id){if(!document.getElementById('red-tax-confirm').checked){toast('请先核实申报调整影响','error');return}const r=getRecord(id);r.redNeedsSync=false;r.sapDoc=r.sapDoc||'9000'+r.id.slice(-4);log(r,'红冲后续 SAP 调整完成，申报影响已人工核实');closeModal();render();toast('红冲后续调整已记录')}
function exportReconciliation(){downloadCSV('SAP对账清单_演示.csv',[['客户','税票号','SAP凭证','原币FOB','红冲原币','净额人民币','状态'],...state.records.filter(r=>r.invoice).map(r=>[r.customer,r.invoice,r.sapDoc,fob(r),r.redAmount,Math.round((fob(r)-r.redAmount)*r.rate*100)/100,STATUSES[r.status][0]])]);toast('对账清单已导出')}
function exceptionsPage(){const rows=state.records.filter(r=>['match','missing','unknown','sap_error'].includes(r.status)||r.redNeedsSync);return head(button('导出异常清单','exportExceptions()',false,'download'))+`<div class="notice warning" style="margin-bottom:20px">${icon('alert')}<span>共 ${rows.length} 项待处理。异常解决前保持当前业务状态，不自动跳过校验。</span></div><section class="card"><div class="card-head"><h2>待处理异常</h2><span class="muted small">按业务影响排序</span></div><div class="table-wrap"><table><thead><tr><th>优先级</th><th>异常事项 / 客户</th><th>责任岗位</th><th>处理建议</th><th>跟进状态</th><th class="right">操作</th></tr></thead><tbody>${rows.map(r=>{const x=exceptionInfo(r);return `<tr><td><span class="badge ${x[0]==='高'?'red':'amber'}">${x[0]}</span></td><td><b style="font-weight:550">${x[1]}</b><div class="sub">${esc(r.customer)} · ${r.id}</div></td><td>${r.owner||x[2]}</td><td style="max-width:240px;color:#7b8c9c;font-size:12px">${x[3]}</td><td><span class="badge ${r.owner?'blue':''}">${r.owner?'已指派':'待认领'}</span></td><td class="right"><div class="flex" style="justify-content:flex-end"><button class="link-btn" onclick="assignException('${r.id}')">指派</button>${r.redNeedsSync?`<button class="link-btn" onclick="syncRed('${r.id}')">处理</button>`:primaryAction(r)}</div></td></tr>`}).join('')||'<tr><td colspan="6"><div class="empty">'+icon('checkCircle')+'<b>当前异常已全部处理</b><p>业务状态已同步更新。</p></div></td></tr>'}</tbody></table></div></section><div class="card" style="margin-top:20px"><div class="card-head"><h2>处理记录</h2><span class="muted small">本次本机操作</span></div><div class="card-body"><div class="timeline">${state.audit.slice(0,8).map(a=>`<div class="timeline-item">${esc(a.text)}<small>业务 ${a.id}</small></div>`).join('')||'<div class="muted">处理异常后，记录将出现在这里。</div>'}</div></div></div>`}
function exceptionInfo(r){if(r.redNeedsSync)return ['高','红冲后续调整待处理','财务','核实 SAP 凭证及退税申报调整影响'];return {match:['中','交货明细存在多个匹配候选','业务 / 关务','按 OA 排载确认交货行，核对数量分配'],missing:['中','缺少有效装船日期证明','关务','补充提单并核实装船日期'],unknown:['高','开票请求超时，结果不明','财务','按原申请号查询，禁止直接重开'],sap_error:['高','税票已开具，SAP 回写失败','SAP 运维','检查接口状态，仅重试回写任务']}[r.status]}
function assignException(id){const r=getRecord(id);modal('指派异常处理',`<div class="section-label">${esc(r.customer)} · ${exceptionInfo(r)[1]}</div><div class="form-grid"><div class="form-field"><label>处理责任人</label><select id="exception-owner"><option>王宁 · 关务</option><option>林悦 · 财务</option><option>赵远 · SAP 运维</option><option>周可 · 业务</option></select></div><div class="form-field"><label>期望完成日期</label><input id="exception-due" type="date" value="2026-09-30" min="2026-09-29"></div><div class="form-field full"><label>处理备注</label><textarea id="exception-note" placeholder="说明需要补充的资料或需核实的事项"></textarea></div></div>`,`${button('取消','closeModal()')}${button('保存指派',`saveAssignment('${id}')`,true)}`)}
function saveAssignment(id){const r=getRecord(id),due=document.getElementById('exception-due');if(!due.reportValidity())return;r.owner=document.getElementById('exception-owner').value;r.due=due.value;log(r,'指派给 '+r.owner+'，期望完成 '+r.due+'；'+document.getElementById('exception-note').value);closeModal();render();toast('已保存责任人与处理备注（未发送外部通知）')}
function exportExceptions(){downloadCSV('异常处理清单_演示.csv',[['业务编号','客户','异常','责任人','完成日期'],...state.records.filter(r=>['match','missing','unknown','sap_error'].includes(r.status)||r.redNeedsSync).map(r=>[r.id,r.customer,exceptionInfo(r)[1],r.owner||exceptionInfo(r)[2],r.due||'待安排'])]);toast('异常清单已导出')}
function productsPage(){const rows=state.mappings.filter(m=>!query||[m.material,m.name,m.hs,m.tax].join(' ').toLowerCase().includes(query.toLowerCase()));return head(button('新增商品映射',"editMapping()",true,'plus'))+`<div class="notice" style="margin-bottom:20px">${icon('info')}<span>海关编码与税收分类编码分别维护。下列编码仅为演示样本，正式映射需使用有效目录并完成业务复核。</span></div><section class="card"><div class="filters"><div class="field-search">${icon('search')}<input type="search" aria-label="搜索商品映射" placeholder="搜索物料、品名或编码" value="${esc(query)}" oninput="query=this.value;refreshProducts()"></div><div class="grow"></div><span class="muted small">已审核 ${state.mappings.filter(m=>m.status==='已审核').length} / ${state.mappings.length}</span></div><div id="products-table">${productsTable(rows)}</div></section><div class="two-col" style="margin-top:20px"><section class="card"><div class="card-head"><h2>匹配使用顺序</h2></div><div class="card-body"><div class="timeline"><div class="timeline-item">企业已审核物料映射<small>相同商品属性、业务范围和有效版本</small></div><div class="timeline-item">历史已确认商品记录<small>复核属性与当前目录的一致性</small></div><div class="timeline-item">智能候选与人工复核<small>无法确定时保留待确认状态</small></div></div></div></section><section class="card"><div class="card-head"><h2>单位换算规则</h2></div><div class="card-body"><div class="calc-row"><span>m / METER</span><strong>米 · 1 : 1</strong></div><div class="calc-row"><span>kg / KGM</span><strong>千克 · 1 : 1</strong></div><div class="notice warning">${icon('alert')}米与千克的转换需要产品或批次依据，不设通用系数。</div></div></section></div>`}
function productsTable(rows){return `<div class="table-wrap"><table><thead><tr><th>物料 / 商品名称</th><th>海关商品编码</th><th>开票税收分类编码</th><th>单位 / 换算</th><th>状态</th><th>维护人</th><th class="right">操作</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b style="font-weight:550">${esc(m.material)}</b><div class="sub">${esc(m.name)}</div></td><td class="mono">${esc(m.hs)}</td><td class="mono">${esc(m.tax)}</td><td>${esc(m.unit)}<div class="sub">转换系数 ${m.factor}</div></td><td><span class="badge ${m.status==='已审核'?'green':'amber'}">${m.status}</span></td><td>${esc(m.owner)}</td><td class="right"><button class="link-btn" onclick="editMapping('${m.id}')">${m.status==='已审核'?'查看 / 编辑':'复核映射'}</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">没有匹配的商品映射</div></td></tr>'}</tbody></table></div>`}
function refreshProducts(){document.getElementById('products-table').innerHTML=productsTable(state.mappings.filter(m=>!query||[m.material,m.name,m.hs,m.tax].join(' ').toLowerCase().includes(query.toLowerCase())))}
function editMapping(id=''){const m=state.mappings.find(x=>x.id===id)||{material:'',name:'',hs:'',tax:'',unit:'米',factor:1,status:'待复核'};modal(id?'维护商品映射':'新增商品映射',`<div class="notice" style="margin-bottom:18px">${icon('info')}保存修改后，未开票且已提交审核的关联业务将退回草稿，重新校验。</div><form id="mapping-form"><div class="form-grid"><div class="form-field"><label>物料号</label><input id="map-material" value="${esc(m.material)}" ${id?'readonly':''} required maxlength="40"></div><div class="form-field"><label>规范商品名称</label><input id="map-name" value="${esc(m.name)}" required maxlength="80"></div><div class="form-field"><label>海关商品编码 · 示例</label><input id="map-hs" value="${esc(m.hs)}" required maxlength="20"></div><div class="form-field"><label>开票税收分类编码 · 示例</label><input id="map-tax" value="${esc(m.tax)}" required maxlength="40"></div><div class="form-field"><label>标准单位</label><select id="map-unit">${['米','千克','件','套'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="form-field"><label>同维度换算系数</label><input id="map-factor" value="${m.factor}" type="number" min="0.000001" step="0.000001" required></div><div class="form-field full"><label>映射依据</label><textarea id="map-evidence" required placeholder="填写商品属性、编码目录版本及单位换算依据">${id?'商品属性与历史已核实资料；演示目录 v2026.09':''}</textarea></div></div><label class="flex" style="margin-top:17px;font-size:13px;align-items:flex-start"><input type="checkbox" id="map-approved">已核实商品属性、目录及适用范围，批准启用该映射。</label></form>`,`${button('保存为待复核',`saveMapping('${id}',false)`)}${button('确认并启用',`saveMapping('${id}',true)`,true,'check')}`)}
function saveMapping(id,approve){if(!document.getElementById('mapping-form').reportValidity())return;if(approve&&!document.getElementById('map-approved').checked){toast('请勾选映射复核确认','error');return}const material=document.getElementById('map-material').value.trim();if(!id&&state.mappings.some(m=>m.material===material)){toast('该物料已有映射，请编辑现有记录','error');return}const m={id:id||'M'+Date.now(),material,name:document.getElementById('map-name').value.trim(),hs:document.getElementById('map-hs').value.trim(),tax:document.getElementById('map-tax').value.trim(),unit:document.getElementById('map-unit').value,factor:Number(document.getElementById('map-factor').value),status:approve?'已审核':'待复核',owner:'林悦',evidence:document.getElementById('map-evidence').value};if(id)state.mappings[state.mappings.findIndex(x=>x.id===id)]=m;else state.mappings.push(m);state.records.filter(r=>r.material===material&&['ready','draft','review','approved'].includes(r.status)).forEach(r=>{r.taxCode=m.tax;if(['review','approved'].includes(r.status)){r.status='draft';r.approval=null}log(r,'商品映射版本更新，未开票草稿重新校验')});save();closeModal();render();toast(approve?'映射已审核启用，相关未开票草稿已重新校验':'映射已保存为待复核')}

</td><td>${x.time}</td></tr>`).join('')||''}</tbody></table></div></section>`}
function sourceConnection(name){modal(name+'接入说明',`<div class="notice">${icon('info')}当前仅展示接入设计，没有读取任何真实业务系统。</div><div class="calc-row"><span>计划接入方式</span><strong>${name==='SAP 财务'?'受控接口 / 既有集成':name==='诺诺开票'?'开票接口 / 文件导入':name==='运输与费用'?'文件导入与结构化提取':'标准导出 / 接口 / 有人值守 RPA'}</strong></div><div class="check-row">${icon('checkCircle')}按法人保存来源、采集时间和原始版本。</div><div class="check-row">${icon('checkCircle')}导入后检查必填项、重复记录与状态变化。</div><div class="check-row">${icon('checkCircle')}写操作保留申请号、回执与操作记录。</div>`,`${button('关闭','closeModal()')}${button('导入本机资料','openImport()',true,'upload')}`)}
function openImport(){modal('导入业务资料',`<div class="notice" style="margin-bottom:20px">${icon('info')}支持 UTF-8 CSV。资料仅在当前浏览器处理，导入后进入待核对状态。</div><div class="file-drop">${icon('upload')}<div class="strong">选择业务明细文件</div><p>请使用模板字段，支持带引号和逗号的 CSV 内容。</p><input id="import-file" type="file" accept=".csv,text/csv" aria-label="选择 CSV 文件"><p class="small">单文件不超过 2 MB，最多 1,000 条记录</p></div><div class="between" style="margin-top:15px"><button class="link-btn" onclick="downloadImportTemplate()">下载导入模板</button><button class="link-btn" onclick="importDemo()">直接加载示例批次</button></div><div id="import-message" style="margin-top:15px"></div>`,`${button('取消','closeModal()')}${button('校验并导入','importCSV()',true,'upload')}`)}
const IMPORT_HEADERS=['关单号','客户','国家','品名','物料号','贸易条款','成交金额','运费','保险费','数量','单位','出口日期'];
function downloadImportTemplate(){downloadCSV('出口业务导入模板.csv',[IMPORT_HEADERS,['DEMO-IMPORT-001','Riverstone Fabrics','德国','纯棉梭织面料','COT-032','CIF',12000,300,40,1500,'米','2026-09-28']]);toast('已下载带示例数据的 CSV 模板')}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV 引号未闭合，请检查文件格式');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importCSV(){const file=document.getElementById('import-file').files[0];if(!file){toast('请选择 CSV 文件，或加载示例批次','error');return}if(!file.name.toLowerCase().endsWith('.csv')||file.size>2*1024*1024){toast('请选择不超过 2 MB 的 CSV 文件','error');return}try{const rows=parseCSV(await file.text());if(rows.length<2)throw Error('文件中没有业务记录');const headers=rows[0].map(s=>s.trim());const missing=IMPORT_HEADERS.filter(h=>!headers.includes(h));if(missing.length)throw Error('缺少字段：'+missing.join('、'));if(rows.length>1001)throw Error('最多支持 1,000 条记录');const errors=[],records=[];rows.slice(1).forEach((row,i)=>{const o=Object.fromEntries(headers.map((h,j)=>[h,(row[j]||'').trim()]));const nums=['成交金额','运费','保险费','数量'];if(IMPORT_HEADERS.some(h=>o[h]==='')||nums.some(h=>!Number.isFinite(Number(o[h]))||Number(o[h])<0)||Number(o.数量)<=0||Number(o.成交金额)<=0||!['FOB','CIF','CFR'].includes(o.贸易条款)||!/^\d{4}-\d{2}-\d{2}$/.test(o.出口日期)||Number(o.运费)+Number(o.保险费)>Number(o.成交金额)){errors.push('第 '+(i+2)+' 行：必填项、金额、日期或贸易条款不符合模板');return}if((o.贸易条款==='FOB'&&(Number(o.运费)!==0||Number(o.保险费)!==0))||(o.贸易条款==='CFR'&&Number(o.保险费)!==0)){errors.push('第 '+(i+2)+' 行：费用与贸易条款不一致');return}records.push(o)});if(errors.length)throw Error(errors.slice(0,4).join('；'));let n=0,dup=0;for(const o of records){if(state.records.some(r=>r.customs===o.关单号)){dup++;continue}const id='IMP'+Date.now().toString().slice(-8)+n;state.records.push({id,customs:o.关单号,customer:o.客户,country:o.国家,product:o.品名,material:o.物料号,term:o.贸易条款,amount:Number(o.成交金额),freight:Number(o.运费),insurance:Number(o.保险费),qty:Number(o.数量),status:'missing',origin:'待确认',date:o.出口日期,currency:'USD',unit:o.单位,order:'待关联',delivery:'待关联',trade:'待关联',hs:'待核实',taxCode:state.mappings.find(m=>m.material===o.物料号)?.tax||'待映射',bl:'待补充',rate:state.rate,matched:false,documents:false,invoice:'',sapDoc:'',redAmount:0,note:'CSV 导入，资料及政策待核实',history:[{time:today,text:'从本机 CSV 导入，等待人工核对'}]});n++}state.imports=state.imports||[];state.imports.push({name:file.name,count:n,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});save();closeModal();go('tasks');toast(`已导入 ${n} 笔，跳过 ${dup} 笔重复关单`)}catch(e){document.getElementById('import-message').innerHTML=`<div class="notice error">${icon('alert')}${esc(e.message)}</div>`}}
function importDemo(){if(state.records.some(r=>r.id==='DEMO-NEW-001')){toast('该示例批次已导入，未重复创建','error');return}const base=initialState().records[0];[{id:'DEMO-NEW-001',customer:'Riverstone Fabrics',amount:12000,freight:300,insurance:40,qty:1500,status:'ready',documents:true},{id:'DEMO-NEW-002',customer:'Eastbay Apparel',amount:18000,freight:500,insurance:60,qty:2300,status:'missing',documents:false}].forEach(x=>state.records.unshift({...base,...x,customs:'DEMO-CUSTOMS-'+x.id.slice(-3),rate:state.rate,invoice:'',sapDoc:'',redAmount:0,history:[{time:'09-29 10:00',text:'导入补充演示批次，资料仅供交互验证'}]}));state.imports=state.imports||[];state.imports.push({name:'补充示例批次',count:2,time:'09-29 10:00'});save();closeModal();go('tasks');toast('已导入 2 笔示例业务')}

function detailSources(r){const docs=[['报关单',r.customs,'file',true],['OA 排载与交货清单',r.trade,'match',r.matched],['运输提单',r.bl,'file',r.documents],['运保费明细',r.term==='FOB'?'本笔业务不涉及':'FEE-'+r.id,'receipt',true]];return `<div class="notice" style="margin-bottom:20px">${icon('info')}以下为依据业务样本生成的结构化演示单据，可用于核对字段与处理流程。</div>${docs.map(([title,no,i,ok])=>`<div class="file-chip">${icon(i)}<div class="grow"><b style="font-size:13px;font-weight:550">${title}</b><small>${no}</small></div>${ok?`<button class="link-btn" onclick="previewSource('${r.id}','${title}')">查看</button>`:`<span class="badge amber">${title.includes('交货')?'待关联':'待补充'}</span>`}</div>`).join('')}${r.origin==='外购'?`<div class="file-chip">${icon('receipt')}<div class="grow"><b>购进凭证</b><small>INPUT-DEMO-${r.id}</small></div><button class="link-btn" onclick="previewSource('${r.id}','购进凭证')">查看</button></div>`:''}<div class="divider"></div><div class="section-label">检查结果</div>${checklist(r)}`}
function previewSource(id,title){const r=getRecord(id);modal(title+' · 结构化预览',`<div class="doc-paper"><div class="doc-title">${title}<span class="badge outline" style="margin-left:10px">演示资料</span></div><div class="form-grid"><div>客户：${esc(r.customer)}</div><div>业务编号：${r.id}</div><div>交易单：${esc(r.trade)}</div><div>关单：${esc(r.customs)}</div><div>商品：<span class="highlight">${esc(r.product)}</span></div><div>数量：<span class="highlight">${fmt(r.qty,0)} ${esc(r.unit)}</span></div><div>成交金额：USD ${fmt(r.amount)}</div><div>贸易方式：${r.term}</div><div>提单：${esc(r.bl)}</div><div>装船日期：${r.documents?r.onboardDate||r.date:'待核实'}</div></div><div class="divider"></div><p class="muted small">此视图展示字段及证据定位的交互方式。正式系统将展示来源原件、页码及提取位置。</p></div>`,`${button('返回依据',`openDetail('${id}','sources')`)}`,true)}
function openNotifications(){const rows=state.records.filter(r=>['review','unknown','sap_error','missing'].includes(r.status));modal('我的待办通知',`${rows.map(r=>`<div class="attention-item" role="button" tabindex="0" onclick="openDetail('${r.id}')" onkeydown="if(event.key==='Enter')openDetail('${r.id}')"><div class="between"><b>${esc(r.customer)}</b>${badge(r.status)}</div><p>${esc(r.customs)}</p></div>`).join('')||'<div class="empty">当前没有待办通知</div>'}`,button('关闭','closeModal()'))}
function openAssistant(question='',id=''){if(id)currentId=id;assistantOpen=true;document.getElementById('assistant-root').innerHTML=`<section class="assistant-panel" aria-label="智能助手"><div class="modal-head" style="padding:17px"><div class="flex" style="gap:9px"><span style="color:var(--brand)">${icon('spark')}</span><div><b>业务智能助手</b><div class="small muted">基于演示数据的交互示例</div></div></div><button class="icon-btn" onclick="closeAssistant()" aria-label="关闭智能助手">${icon('close')}</button></div><div class="chat-body" id="chat-body"><div class="chat-bubble">可以帮你查看待办、解释 FOB 计算，或找到业务卡点。<div class="chat-suggestions"><button onclick="askAssistant('今天有哪些业务需要优先处理？')">优先处理什么</button><button onclick="askAssistant('解释 FOB 计算')">解释 FOB</button><button onclick="askAssistant('如何处理 SAP 尾差？')">处理 SAP 尾差</button></div></div></div><form class="chat-input" onsubmit="event.preventDefault();askAssistant(document.getElementById('chat-input').value)"><input id="chat-input" type="text" placeholder="输入问题，查看演示分析" aria-label="向智能助手提问" maxlength="400"><button class="btn primary" type="submit" aria-label="发送问题">${icon('send')}</button></form></section>`;if(question)askAssistant(question)}
function closeAssistant(){assistantOpen=false;document.getElementById('assistant-root').innerHTML=''}
function askAssistant(question){question=question.trim();if(!question)return;const input=document.getElementById('chat-input');input.value='';const body=document.getElementById('chat-body');body.insertAdjacentHTML('beforeend',`<div class="chat-bubble user">${esc(question)}</div>`);const r=getRecord(currentId)||getRecord(draftId)||state.records[0];let answer='';if(/FOB|金额|计算|汇率/i.test(question)){answer=`以 <b>${esc(r.customer)}</b> 为例：<br>${r.term} 成交金额 USD ${fmt(r.amount)}<br>减国际运费 USD ${fmt(r.freight)}<br>减保险费 USD ${fmt(r.insurance)}<br><b>FOB = USD ${fmt(fob(r))}</b><br>按 ${r.rate} 折算为 ${money(rmb(r))}。<br>商业成交金额与 FOB 口径分别保存。<span class="cite">依据：关单 ${esc(r.customs)} · 费用明细 FEE-${r.id}</span><button class="link-btn" onclick="openDetail('${r.id}')">查看业务依据</button>`}else if(/SAP|尾差|强平/i.test(question)){answer=`先核对比较金额的币种、费用口径与汇率日期，再检查逐行和汇总舍入顺序。<br><br>当前舍入差复核阈值为 <b>¥ ${fmt(state.tolerance)}</b>，阈值内也不自动抹去差异。真实汇率或费用差异交由财务确认。<span class="cite">依据：业务规则 v2026.09 · 当前本机配置</span><button class="link-btn" onclick="closeAssistant();go('reconcile')">查看 SAP 对账</button>`}else if(/建议|这笔|当前|匹配/.test(question)&&currentId){answer=`${esc(r.customer)} 当前为 <b>${STATUSES[r.status][0]}</b>。<br>${r.status==='unknown'?'应先按原申请号查证出票结果，不能直接重新开票。':r.status==='sap_error'?'税票已取得，只需重试 SAP 回写。':r.status==='match'?'按 OA 排载确认交货明细，并核对数量分配与外购政策。':r.status==='missing'?'补充有效提单并核实日期，再检查单据关联。':'可根据当前业务状态继续处理，金额或商品发生变化时重新审核。'}<span class="cite">依据：业务 ${r.id} · 当前状态及处理记录</span><button class="link-btn" onclick="openDetail('${r.id}')">查看业务详情</button>`}else{const list=state.records.filter(x=>['unknown','sap_error','missing','match','review'].includes(x.status));answer=`当前有 <b>${list.length}</b> 笔业务需要关注：<br><br>${list.slice(0,5).map(x=>`<button class="link-btn" style="display:block;text-align:left" onclick="openDetail('${x.id}')">${esc(x.customer)} · ${STATUSES[x.status][0]}</button>`).join('')||'没有待处理的异常或审核。'}<span class="cite">依据：当前业务台账 · 本机模拟分析，未调用在线模型</span>`}body.insertAdjacentHTML('beforeend',`<div class="chat-bubble">${answer}</div>`);body.scrollTop=body.scrollHeight}
function renderPage(){return ({dashboard,tasks:tasksPage,matching:matchingPage,drafts:draftsPage,review:reviewPage,issuing:issuingPage,reconcile:reconcilePage,exceptions:exceptionsPage,products:productsPage,data:dataPage,settings:settingsPage}[route]||dashboard)()}
function refreshTable(){const host=document.getElementById('records-table');if(host)host.innerHTML=route==='issuing'?invoiceTable():recordTable(currentRows(),route==='dashboard'?6:8);updateBatch()}
document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const overlay=document.querySelector('#overlay-root [role="dialog"]');if(!overlay)return;const focusable=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,a[href],[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}});
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'read_export_demo_status',title:'读取出口开票演示状态',description:'只读返回当前本机演示业务状态，不访问真实业务系统。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('此工具不接受参数');return {demo:true,route,records:state.records.map(r=>({id:r.id,customer:r.customer,status:STATUSES[r.status][0],fob:fob(r),rmb:rmb(r)}))}}});document.modelContext.registerTool({name:'navigate_export_demo',title:'切换出口开票页面',description:'切换本机演示应用页面，不执行开票、审批或回写。',inputSchema:{type:'object',properties:{page:{type:'string',enum:Object.keys(META)}},required:['page'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).some(k=>k!=='page')||!Object.hasOwn(META,input.page))throw Error('无效页面');go(input.page);return {demo:true,page:route,title:META[route][0]}}})}catch(e){}}
document.getElementById('workspace-icon').innerHTML=icon('building');document.getElementById('menu-btn').innerHTML=icon('menu');document.getElementById('global-search-icon').innerHTML=icon('search');document.getElementById('bell-btn').innerHTML=icon('bell');document.getElementById('assistant-fab').innerHTML=icon('spark')+'智能助手';
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==route){route=META[next]?next:'dashboard';query='';filter='all';selected.clear();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('assistant-root').innerHTML='';assistantOpen=false;toggleNav(false)}});
render();
</script>
</body>
</html>
